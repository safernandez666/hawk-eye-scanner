                    <div class="page-pretitle" style="font-size:.625rem;">Poirot DSPM</div>

            <div class="page-body" style="padding-top:.5rem;">

    <script src="https://cdn.jsdelivr.net/npm/@tabler/core@1.0.0-beta20/dist/js/tabler.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/apexcharts"></script>
    <script>
        const API_URL = '/api';
        const THEME_KEY = 'poirot-theme';
        function initTheme() {
            const saved = localStorage.getItem(THEME_KEY) || 'light';
            document.documentElement.setAttribute('data-bs-theme', saved);
            document.getElementById('theme-icon').className = saved === 'dark' ? 'ti ti-sun' : 'ti ti-moon';
        }
        function setTheme(theme) {
            document.documentElement.setAttribute('data-bs-theme', theme);
            localStorage.setItem(THEME_KEY, theme);
            document.getElementById('theme-icon').className = theme === 'dark' ? 'ti ti-sun' : 'ti ti-moon';
        }

        async function loadTimeline() {
            try {
                const res = await fetch(`${API_URL}/timeline?days=30`);
                const data = await res.json();
                const timeline = data.timeline || {};
                const dates = Object.keys(timeline).sort();
                const severities = ['CRITICAL', 'HIGH', 'MEDIUM', 'LOW'];
                const colors = { CRITICAL: '#d63939', HIGH: '#f76707', MEDIUM: '#f59f00', LOW: '#2fb344' };

                new ApexCharts(document.getElementById('timeline-chart'), {
                    chart: { type: 'area', height: 350, stacked: true, toolbar: { show: true }, fontFamily: 'inherit' },
                    series: severities.map(s => ({ name: s, data: dates.map(d => timeline[d][s] || 0) })),
                    colors: severities.map(s => colors[s]),
                    xaxis: { categories: dates.map(d => new Date(d).toLocaleDateString('es-ES', { month: 'short', day: 'numeric' })), labels: { style: { fontSize: '10px' } } },
                    yaxis: { title: { text: 'Detecciones', style: { fontSize: '11px' } }, labels: { style: { fontSize: '10px' } } },
                    stroke: { curve: 'smooth', width: 1.5 },
                    fill: { type: 'gradient', gradient: { shadeIntensity: 1, opacityFrom: 0.6, opacityTo: 0.2 } },
                    legend: { position: 'top', fontSize: '11px' },
                    tooltip: { shared: true, intersect: false }
                }).render();
            } catch (error) { console.error('Error:', error); }
        }

        document.addEventListener('DOMContentLoaded', () => { initTheme(); loadTimeline(); });
    </script>
</body>
</html>
