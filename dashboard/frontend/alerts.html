<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Alertas - Poirot DSPM</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/core@1.0.0-beta20/dist/css/tabler.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">

    <style>
        @media (min-width: 992px) {
            .navbar-vertical { width: 200px; }
            .navbar-vertical ~ .page-wrapper { margin-left: 200px; }
            .navbar-vertical .nav-link-title { font-size: .8125rem; }
            .navbar-vertical .nav-link-icon { width: 1.25rem; height: 1.25rem; }
            .navbar-vertical .navbar-brand { font-size: .875rem; }
        }
        .table-sm-custom td, .table-sm-custom th { padding: .4rem .5rem; font-size: .8125rem; }
    </style>
</head>
<body class="page">
    <div class="page">
        <aside class="navbar navbar-vertical navbar-expand-lg" data-bs-theme="dark">
            <div class="container-fluid">
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#sidebar-menu">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <h1 class="navbar-brand navbar-brand-autodark">
                    <a href="/"><i class="ti ti-moustache me-1"></i>Poirot</a>
                </h1>
                <div class="collapse navbar-collapse" id="sidebar-menu">
                    <ul class="navbar-nav pt-lg-3">
                        <li class="nav-item"><a class="nav-link" href="/"><span class="nav-link-icon"><i class="ti ti-dashboard"></i></span><span class="nav-link-title">Dashboard</span></a></li>
                        <li class="nav-item"><a class="nav-link active" href="/alerts.html"><span class="nav-link-icon"><i class="ti ti-alert-triangle"></i></span><span class="nav-link-title">Alertas</span></a></li>
                        <li class="nav-item"><a class="nav-link" href="/patterns.html"><span class="nav-link-icon"><i class="ti ti-fingerprint"></i></span><span class="nav-link-title">Patrones</span></a></li>
                        <li class="nav-item"><a class="nav-link" href="/timeline.html"><span class="nav-link-icon"><i class="ti ti-chart-line"></i></span><span class="nav-link-title">Timeline</span></a></li>
                        <li class="nav-item"><a class="nav-link" href="/sources.html"><span class="nav-link-icon"><i class="ti ti-database"></i></span><span class="nav-link-title">Fuentes</span></a></li>
                        <li class="nav-item"><a class="nav-link" href="http://localhost:9000" target="_blank"><span class="nav-link-icon"><i class="ti ti-bug"></i></span><span class="nav-link-title">TheHive</span><i class="ti ti-external-link ms-auto" style="font-size:.7rem;opacity:.5;"></i></a></li>
                    </ul>
                </div>
            </div>
        </aside>

        <div class="page-wrapper">
            <header class="navbar navbar-expand-md d-print-none" style="min-height:auto; padding:.4rem 0;">
                <div class="container-xl">
                    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#sidebar-menu"><span class="navbar-toggler-icon"></span></button>
                    <div class="navbar-nav flex-row order-md-last">
                        <div class="nav-item dropdown me-2">
                            <a href="#" class="nav-link px-0" data-bs-toggle="dropdown"><i class="ti ti-moon" id="theme-icon" style="font-size:1rem;"></i></a>
                            <div class="dropdown-menu dropdown-menu-end">
                                <a class="dropdown-item" href="#" onclick="setTheme('light')"><i class="ti ti-sun me-2"></i>Light</a>
                                <a class="dropdown-item" href="#" onclick="setTheme('dark')"><i class="ti ti-moon me-2"></i>Dark</a>
                            </div>
                        </div>
                        <div class="nav-item"><a href="#" class="nav-link px-0" style="font-size:.8125rem;"><i class="ti ti-user me-1"></i>Admin</a></div>
                    </div>
                </div>
            </header>

            <div class="page-header d-print-none" style="padding:.5rem 0;">
                <div class="container-xl">
                    <div class="page-pretitle" style="font-size:.625rem;">Poirot DSPM</div>
                    <h2 class="page-title" style="font-size:1.125rem;">Alertas</h2>
                </div>
            </div>

            <div class="page-body" style="padding-top:.5rem;">
                <div class="container-xl">
                    <!-- Filters -->
                    <div class="card mb-2">
                        <div class="card-body py-2 px-3">
                            <div class="row g-2 align-items-end">
                                <div class="col-md-3">
                                    <label class="form-label" style="font-size:.75rem;">Severidad</label>
                                    <select class="form-select form-select-sm" id="filter-severity">
                                        <option value="">Todas</option>
                                        <option value="CRITICAL">Critical</option>
                                        <option value="HIGH">High</option>
                                        <option value="MEDIUM">Medium</option>
                                        <option value="LOW">Low</option>
                                    </select>
                                </div>
                                <div class="col-md-3">
                                    <label class="form-label" style="font-size:.75rem;">Estado</label>
                                    <select class="form-select form-select-sm" id="filter-status">
                                        <option value="">Todos</option>
                                        <option value="NEW">New</option>
                                        <option value="SENT">Sent</option>
                                        <option value="REOPENED">Reopened</option>
                                        <option value="ACKNOWLEDGED">Acknowledged</option>
                                        <option value="FALSE_POSITIVE">False Positive</option>
                                    </select>
                                </div>
                                <div class="col-md-3">
                                    <label class="form-label" style="font-size:.75rem;">Fuente</label>
                                    <select class="form-select form-select-sm" id="filter-source">
                                        <option value="">Todas</option>
                                        <option value="mysql">MySQL</option>
                                        <option value="s3">S3</option>
                                    </select>
                                </div>
                                <div class="col-md-3">
                                    <button class="btn btn-primary btn-sm w-100" onclick="applyFilters()">
                                        <i class="ti ti-filter me-1"></i>Filtrar
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Alerts Table -->
                    <div class="card">
                        <div class="card-header" style="padding:.5rem 1rem;">
                            <h3 class="card-title" style="font-size:.8125rem;">Lista de Alertas</h3>
                            <div class="card-actions">
                                <span class="badge bg-secondary" id="total-alerts" style="font-size:.7rem;">0 alertas</span>
                            </div>
                        </div>
                        <div class="table-responsive">
                            <table class="table table-vcenter card-table table-hover table-sm-custom">
                                <thead>
                                    <tr>
                                        <th>Severidad</th>
                                        <th>Patron</th>
                                        <th>Fuente</th>
                                        <th>Ubicacion</th>
                                        <th>Estado</th>
                                        <th>Detecciones</th>
                                        <th>TheHive</th>
                                        <th>Acciones</th>
                                    </tr>
                                </thead>
                                <tbody id="alerts-table">
                                    <tr><td colspan="8" class="text-center py-3 text-muted">Cargando alertas...</td></tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Alert Detail Modal -->
            <div class="modal modal-blur fade" id="alertModal" tabindex="-1">
                <div class="modal-dialog modal-lg">
                    <div class="modal-content">
                        <div class="modal-header py-2">
                            <h5 class="modal-title" style="font-size:.9rem;">Detalle de Alerta</h5>
                            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                        </div>
                        <div class="modal-body" id="alert-modal-content" style="font-size:.8125rem;"></div>
                        <div class="modal-footer py-2">
                            <button type="button" class="btn btn-sm me-auto" data-bs-dismiss="modal">Cerrar</button>
                            <a id="thehive-link" href="#" target="_blank" class="btn btn-primary btn-sm" style="display:none;">
                                <i class="ti ti-bug me-1"></i>Ver en TheHive
                            </a>
                        </div>
                    </div>
                </div>
            </div>

            <footer class="footer footer-transparent d-print-none" style="padding:.5rem 0; font-size:.75rem;">
                <div class="container-xl">
                    <strong>Poirot DSPM</strong> &copy; 2025
                </div>
            </footer>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@tabler/core@1.0.0-beta20/dist/js/tabler.min.js"></script>
    <script>
        const API_URL = '/api';
        let currentAlerts = [];

        const THEME_KEY = 'poirot-theme';
        function initTheme() {
            const saved = localStorage.getItem(THEME_KEY) || 'light';
            document.documentElement.setAttribute('data-bs-theme', saved);
            document.getElementById('theme-icon').className = saved === 'dark' ? 'ti ti-sun' : 'ti ti-moon';
        }
        function setTheme(theme) {
            document.documentElement.setAttribute('data-bs-theme', theme);
            localStorage.setItem(THEME_KEY, theme);
            document.getElementById('theme-icon').className = theme === 'dark' ? 'ti ti-sun' : 'ti ti-moon';
        }

        async function loadAlerts() {
            const severity = document.getElementById('filter-severity').value;
            const status = document.getElementById('filter-status').value;
            const source = document.getElementById('filter-source').value;

            let url = `${API_URL}/alerts?limit=100`;
            if (severity) url += `&severity=${severity}`;
            if (status) url += `&status=${status}`;
            if (source) url += `&source=${source}`;

            try {
                const res = await fetch(url);
                const data = await res.json();
                currentAlerts = data.alerts || [];
                document.getElementById('total-alerts').textContent = `${currentAlerts.length} alertas`;
                renderAlerts(currentAlerts);
            } catch (error) {
                console.error('Error loading alerts:', error);
            }
        }

        function renderAlerts(alerts) {
            const tbody = document.getElementById('alerts-table');
            if (alerts.length === 0) {
                tbody.innerHTML = '<tr><td colspan="8" class="text-center py-3 text-muted">No se encontraron alertas</td></tr>';
                return;
            }
            tbody.innerHTML = alerts.map(a => `
                <tr style="cursor:pointer;" onclick="showAlertDetail('${a.alert_hash}')">
                    <td><span class="badge bg-${getSeverityBg(a.severity)}" style="font-size:.7rem;">${a.severity}</span></td>
                    <td>${a.pattern_name}</td>
                    <td><i class="ti ti-${getSourceIcon(a.data_source)} me-1"></i>${a.data_source}</td>
                    <td><code style="font-size:.75rem;">${a.location}</code></td>
                    <td><span class="badge bg-${getStatusBg(a.status)}" style="font-size:.7rem;">${a.status}</span></td>
                    <td>${a.count}</td>
                    <td>${a.thehive_case_id ? `<span class="badge bg-azure" style="font-size:.65rem;">${a.thehive_case_id}</span>` : '-'}</td>
                    <td><button class="btn btn-sm btn-icon btn-outline-primary" style="width:24px;height:24px;"><i class="ti ti-eye" style="font-size:.75rem;"></i></button></td>
                </tr>
            `).join('');
        }

        function showAlertDetail(hash) {
            const a = currentAlerts.find(x => x.alert_hash === hash);
            if (!a) return;
            document.getElementById('alert-modal-content').innerHTML = `
                <div class="row g-2">
                    <div class="col-md-6">
                        <div class="mb-2"><label class="form-label text-muted mb-0" style="font-size:.7rem;">Hash</label><div><code style="font-size:.75rem;">${a.alert_hash}</code></div></div>
                        <div class="mb-2"><label class="form-label text-muted mb-0" style="font-size:.7rem;">Patron</label><div>${a.pattern_name}</div></div>
                        <div class="mb-2"><label class="form-label text-muted mb-0" style="font-size:.7rem;">Severidad</label><div><span class="badge bg-${getSeverityBg(a.severity)}">${a.severity}</span></div></div>
                        <div class="mb-2"><label class="form-label text-muted mb-0" style="font-size:.7rem;">Fuente</label><div>${a.data_source}</div></div>
                    </div>
                    <div class="col-md-6">
                        <div class="mb-2"><label class="form-label text-muted mb-0" style="font-size:.7rem;">Ubicacion</label><div><code style="font-size:.75rem;">${a.location}</code></div></div>
                        <div class="mb-2"><label class="form-label text-muted mb-0" style="font-size:.7rem;">Estado</label><div><span class="badge bg-${getStatusBg(a.status)}">${a.status}</span></div></div>
                        <div class="mb-2"><label class="form-label text-muted mb-0" style="font-size:.7rem;">Detecciones</label><div>${a.count}</div></div>
                        <div class="mb-2"><label class="form-label text-muted mb-0" style="font-size:.7rem;">Re-aperturas</label><div>${a.reopen_count || 0}</div></div>
                    </div>
                </div>
                <hr class="my-2">
                <div class="row g-2">
                    <div class="col-md-6"><label class="form-label text-muted mb-0" style="font-size:.7rem;">Primera deteccion</label><div>${formatDate(a.first_seen)}</div></div>
                    <div class="col-md-6"><label class="form-label text-muted mb-0" style="font-size:.7rem;">Ultima deteccion</label><div>${formatDate(a.last_seen)}</div></div>
                </div>
                ${a.notes ? `<hr class="my-2"><label class="form-label text-muted mb-0" style="font-size:.7rem;">Notas</label><div>${a.notes}</div>` : ''}
            `;
            const link = document.getElementById('thehive-link');
            if (a.thehive_case_id) { link.href = `http://localhost:9000/cases/${a.thehive_case_id}/details`; link.style.display = 'inline-block'; }
            else { link.style.display = 'none'; }
            new bootstrap.Modal(document.getElementById('alertModal')).show();
        }

        function applyFilters() { loadAlerts(); }

        function getSeverityBg(s) { return { 'CRITICAL':'red','HIGH':'orange','MEDIUM':'yellow','LOW':'green' }[s] || 'secondary'; }
        function getStatusBg(s) { return { 'NEW':'secondary','SENT':'blue','REOPENED':'red','ACKNOWLEDGED':'green','FALSE_POSITIVE':'dark' }[s] || 'secondary'; }
        function getSourceIcon(s) { return { 'mysql':'database','s3':'cloud' }[s] || 'help'; }
        function formatDate(d) { if (!d) return '-'; return new Date(d).toLocaleString('es-ES'); }

        document.addEventListener('DOMContentLoaded', () => { initTheme(); loadAlerts(); });
    </script>
</body>
</html>
