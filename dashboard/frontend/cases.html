<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Casos - Poirot DSPM</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/core@1.0.0-beta20/dist/css/tabler.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">

    <style>
        @media (min-width: 992px) {
            .navbar-vertical { width: 200px; }
            .navbar-vertical ~ .page-wrapper { margin-left: 200px; }
            .navbar-vertical .nav-link-title { font-size: .8125rem; }
            .navbar-vertical .nav-link-icon { width: 1.25rem; height: 1.25rem; }
            .navbar-vertical .navbar-brand { font-size: 1.25rem; }
        }
        .table-sm-custom td, .table-sm-custom th { padding: .4rem .5rem; font-size: .8125rem; }
    </style>
</head>
<body class="page">
    <div class="page">
        <aside class="navbar navbar-vertical navbar-expand-lg" data-bs-theme="dark">
            <div class="container-fluid">
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#sidebar-menu"><span class="navbar-toggler-icon"></span></button>
                <h1 class="navbar-brand navbar-brand-autodark"><a href="/"><i class="ti ti-moustache me-2" style="font-size:1.5rem;"></i>Poirot</a></h1>
                <div class="collapse navbar-collapse" id="sidebar-menu">
                    <ul class="navbar-nav pt-lg-3">
                        <li class="nav-item"><a class="nav-link" href="/"><span class="nav-link-icon"><i class="ti ti-dashboard"></i></span><span class="nav-link-title">Dashboard</span></a></li>
                        <li class="nav-item"><a class="nav-link" href="/alerts.html"><span class="nav-link-icon"><i class="ti ti-alert-triangle"></i></span><span class="nav-link-title">Alertas</span><span class="badge bg-red badge-sm ms-auto" id="sidebar-critical-count" style="display:none;">0</span></a></li>
                        <li class="nav-item"><a class="nav-link" href="/patterns.html"><span class="nav-link-icon"><i class="ti ti-fingerprint"></i></span><span class="nav-link-title">Patrones</span></a></li>
                        <li class="nav-item"><a class="nav-link" href="/timeline.html"><span class="nav-link-icon"><i class="ti ti-chart-line"></i></span><span class="nav-link-title">Timeline</span></a></li>
                        <li class="nav-item"><a class="nav-link" href="/sources.html"><span class="nav-link-icon"><i class="ti ti-database"></i></span><span class="nav-link-title">Fuentes</span></a></li>
                        <li class="nav-item" id="nav-casos"><a class="nav-link active" href="/cases.html"><span class="nav-link-icon"><i class="ti ti-briefcase"></i></span><span class="nav-link-title">Casos</span><span class="badge bg-azure badge-sm ms-auto" id="sidebar-cases-count" style="display:none;">0</span></a></li>
                        <li class="nav-item"><a class="nav-link" href="/settings.html"><span class="nav-link-icon"><i class="ti ti-settings"></i></span><span class="nav-link-title">Configuracion</span></a></li>
                    </ul>
                </div>
            </div>
        </aside>

        <div class="page-wrapper">
            <header class="navbar navbar-expand-md d-print-none" style="min-height:auto; padding:.4rem 0;">
                <div class="container-xl">
                    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#sidebar-menu"><span class="navbar-toggler-icon"></span></button>
                    <div class="navbar-nav flex-row order-md-last">
                        <div class="nav-item dropdown me-2">
                            <a href="#" class="nav-link px-0" data-bs-toggle="dropdown"><i class="ti ti-moon" id="theme-icon" style="font-size:1rem;"></i></a>
                            <div class="dropdown-menu dropdown-menu-end">
                                <a class="dropdown-item" href="#" onclick="setTheme('light')"><i class="ti ti-sun me-2"></i>Light</a>
                                <a class="dropdown-item" href="#" onclick="setTheme('dark')"><i class="ti ti-moon me-2"></i>Dark</a>
                            </div>
                        </div>
                        <div class="nav-item"><a href="#" class="nav-link px-0" style="font-size:.8125rem;"><i class="ti ti-user me-1"></i>Admin</a></div>
                    </div>
                </div>
            </header>

            <div class="page-header d-print-none" style="padding:.5rem 0;">
                <div class="container-xl">
                    <div class="d-flex align-items-center">
                        <div>
                            <div class="page-pretitle" style="font-size:.625rem;">Poirot DSPM</div>
                            <h2 class="page-title" style="font-size:1.125rem;">Casos TheHive</h2>
                        </div>
                        <div class="ms-auto d-flex gap-2 align-items-center">
                            <button class="btn btn-primary btn-sm" id="sync-btn" onclick="syncToTheHive()" style="font-size:.7rem; padding:.2rem .5rem;">
                                <i class="ti ti-refresh me-1" id="sync-icon"></i><span id="sync-text">Sincronizar Alertas</span>
                            </button>
                            <span class="badge bg-secondary" id="thehive-status" style="font-size:.7rem;">Verificando...</span>
                        </div>
                    </div>
                </div>
            </div>

            <div class="page-body" style="padding-top:.5rem;">
                <div class="container-xl">
                    <div class="card">
                        <div class="card-header" style="padding:.5rem 1rem;">
                            <h3 class="card-title" style="font-size:.8125rem;">Lista de Casos</h3>
                            <div class="card-actions">
                                <span class="badge bg-secondary" id="cases-count" style="font-size:.7rem;">0 casos</span>
                            </div>
                        </div>
                        <div class="table-responsive">
                            <table class="table table-vcenter card-table table-hover table-sm-custom">
                                <thead>
                                    <tr>
                                        <th>Titulo</th>
                                        <th>Severidad</th>
                                        <th>Estado</th>
                                        <th>Tags</th>
                                        <th>Fecha</th>
                                    </tr>
                                </thead>
                                <tbody id="cases-table">
                                    <tr><td colspan="5" class="text-center py-3 text-muted">Cargando casos...</td></tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Case Detail Modal -->
            <div class="modal modal-blur fade" id="caseModal" tabindex="-1">
                <div class="modal-dialog modal-lg">
                    <div class="modal-content">
                        <div class="modal-header py-2">
                            <h5 class="modal-title" style="font-size:.9rem;">Detalle del Caso</h5>
                            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                        </div>
                        <div class="modal-body" id="case-modal-content" style="font-size:.8125rem;"></div>
                        <div class="modal-footer py-2">
                            <button type="button" class="btn btn-sm" data-bs-dismiss="modal">Cerrar</button>
                        </div>
                    </div>
                </div>
            </div>

            <footer class="footer footer-transparent d-print-none" style="padding:.5rem 0; font-size:.75rem;">
                <div class="container-xl"><strong>Poirot DSPM</strong> &copy; 2025</div>
            </footer>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@tabler/core@1.0.0-beta20/dist/js/tabler.min.js"></script>
    <script>
        const API_URL = '/api';
        const THEME_KEY = 'poirot-theme';
        let casesData = [];

        function initTheme() {
            const saved = localStorage.getItem(THEME_KEY) || 'light';
            document.documentElement.setAttribute('data-bs-theme', saved);
            document.getElementById('theme-icon').className = saved === 'dark' ? 'ti ti-sun' : 'ti ti-moon';
        }
        function setTheme(theme) {
            document.documentElement.setAttribute('data-bs-theme', theme);
            localStorage.setItem(THEME_KEY, theme);
            document.getElementById('theme-icon').className = theme === 'dark' ? 'ti ti-sun' : 'ti ti-moon';
        }

        const severityMap = { 1: 'LOW', 2: 'MEDIUM', 3: 'HIGH', 4: 'CRITICAL' };
        const severityBg = { 1: 'green', 2: 'yellow', 3: 'orange', 4: 'red' };
        const statusMap = { 'New': 'secondary', 'InProgress': 'blue', 'Resolved': 'green', 'Closed': 'dark' };

        async function checkTheHiveStatus() {
            try {
                const res = await fetch(`${API_URL}/thehive/status`);
                const data = await res.json();
                const el = document.getElementById('thehive-status');
                if (data.status === 'connected') {
                    el.className = 'badge bg-green';
                    el.style.fontSize = '.7rem';
                    el.textContent = 'TheHive conectado';
                } else {
                    el.className = 'badge bg-red';
                    el.style.fontSize = '.7rem';
                    el.textContent = 'TheHive no disponible';
                }
            } catch (e) {
                const el = document.getElementById('thehive-status');
                el.className = 'badge bg-red';
                el.style.fontSize = '.7rem';
                el.textContent = 'Error de conexion';
            }
        }

        async function loadCases() {
            try {
                const res = await fetch(`${API_URL}/thehive/cases`);
                const data = await res.json();
                casesData = data.cases || [];
                document.getElementById('cases-count').textContent = `${casesData.length} casos`;
                const tbody = document.getElementById('cases-table');

                if (casesData.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="5" class="text-center py-3 text-muted">No hay casos en TheHive</td></tr>';
                    return;
                }

                tbody.innerHTML = casesData.map(c => {
                    const sev = c.severity || 1;
                    const tags = (c.tags || []).map(t => `<span class="badge bg-azure-lt me-1" style="font-size:.65rem;">${escapeHtml(t)}</span>`).join('');
                    const status = c.status || 'New';
                    const date = c._createdAt ? new Date(c._createdAt).toLocaleDateString('es-ES', { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' }) : '-';
                    return `
                        <tr style="cursor:pointer;" onclick="showCaseDetail('${c._id || c.id}')">
                            <td>${escapeHtml(c.title || 'Sin titulo')}</td>
                            <td><span class="badge bg-${severityBg[sev] || 'secondary'}" style="font-size:.7rem;">${severityMap[sev] || 'UNKNOWN'}</span></td>
                            <td><span class="badge bg-${statusMap[status] || 'secondary'}" style="font-size:.7rem;">${status}</span></td>
                            <td>${tags || '-'}</td>
                            <td>${date}</td>
                        </tr>
                    `;
                }).join('');
            } catch (error) {
                console.error('Error loading cases:', error);
                document.getElementById('cases-table').innerHTML = '<tr><td colspan="5" class="text-center py-3 text-danger">Error al conectar con TheHive</td></tr>';
            }
        }

        async function showCaseDetail(caseId) {
            try {
                const res = await fetch(`${API_URL}/thehive/cases/${caseId}`);
                const c = await res.json();
                const sev = c.severity || 1;
                const status = c.status || 'New';
                const tags = (c.tags || []).map(t => `<span class="badge bg-azure-lt me-1" style="font-size:.65rem;">${escapeHtml(t)}</span>`).join('') || '-';

                document.getElementById('case-modal-content').innerHTML = `
                    <div class="row g-2">
                        <div class="col-md-6">
                            <div class="mb-2"><label class="form-label text-muted mb-0" style="font-size:.7rem;">Titulo</label><div style="font-weight:500;">${escapeHtml(c.title || '')}</div></div>
                            <div class="mb-2"><label class="form-label text-muted mb-0" style="font-size:.7rem;">Severidad</label><div><span class="badge bg-${severityBg[sev] || 'secondary'}">${severityMap[sev] || 'UNKNOWN'}</span></div></div>
                            <div class="mb-2"><label class="form-label text-muted mb-0" style="font-size:.7rem;">Estado</label><div><span class="badge bg-${statusMap[status] || 'secondary'}">${status}</span></div></div>
                        </div>
                        <div class="col-md-6">
                            <div class="mb-2"><label class="form-label text-muted mb-0" style="font-size:.7rem;">Tags</label><div>${tags}</div></div>
                            <div class="mb-2"><label class="form-label text-muted mb-0" style="font-size:.7rem;">Creado</label><div>${c._createdAt ? new Date(c._createdAt).toLocaleString('es-ES') : '-'}</div></div>
                            <div class="mb-2"><label class="form-label text-muted mb-0" style="font-size:.7rem;">Actualizado</label><div>${c._updatedAt ? new Date(c._updatedAt).toLocaleString('es-ES') : '-'}</div></div>
                        </div>
                    </div>
                    ${c.description ? `<hr class="my-2"><label class="form-label text-muted mb-0" style="font-size:.7rem;">Descripcion</label><div style="white-space:pre-wrap;">${escapeHtml(c.description)}</div>` : ''}
                `;
                new bootstrap.Modal(document.getElementById('caseModal')).show();
            } catch (error) {
                console.error('Error loading case detail:', error);
                alert('Error al cargar detalle del caso');
            }
        }

        function escapeHtml(str) {
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        async function syncToTheHive() {
            const btn = document.getElementById('sync-btn');
            const icon = document.getElementById('sync-icon');
            const text = document.getElementById('sync-text');
            btn.disabled = true;
            icon.className = 'ti ti-loader animate-spin me-1';
            text.textContent = 'Sincronizando...';

            try {
                const res = await fetch(`${API_URL}/thehive/sync`, { method: 'POST' });
                const data = await res.json();
                if (data.created > 0) {
                    text.textContent = `${data.created} casos creados`;
                    icon.className = 'ti ti-check me-1';
                    loadCases();
                    loadSidebarBadges();
                } else {
                    text.textContent = data.message || 'Sin cambios';
                    icon.className = 'ti ti-check me-1';
                }
            } catch (error) {
                text.textContent = 'Error';
                icon.className = 'ti ti-x me-1';
                console.error('Sync error:', error);
            }

            setTimeout(() => {
                btn.disabled = false;
                icon.className = 'ti ti-refresh me-1';
                text.textContent = 'Sincronizar Alertas';
            }, 3000);
        }

        async function loadSidebarBadges() {
            try {
                const res = await fetch(`${API_URL}/stats`);
                const stats = await res.json();
                const cp = stats.critical_pending || 0;
                const el = document.getElementById('sidebar-critical-count');
                if (cp > 0) { el.textContent = cp; el.style.display = 'inline-block'; }
            } catch (e) {}
        }

        async function checkFeatures() {
            try {
                const res = await fetch(`${API_URL}/config/features`);
                const data = await res.json();
                if (!data.thehive_enabled) {
                    document.getElementById('sync-btn').style.display = 'none';
                    document.getElementById('thehive-status').textContent = 'Deshabilitado';
                    document.getElementById('thehive-status').className = 'badge bg-secondary';
                    document.getElementById('thehive-status').style.fontSize = '.7rem';
                    document.getElementById('cases-table').innerHTML = '<tr><td colspan="5" class="text-center py-4 text-muted"><i class="ti ti-info-circle me-1"></i>TheHive no esta habilitado. Configure THEHIVE_ENABLED=true y use docker compose --profile thehive up -d</td></tr>';
                    return true;
                }
            } catch (e) {}
            return false;
        }

        document.addEventListener('DOMContentLoaded', async () => {
            initTheme();
            const disabled = await checkFeatures();
            if (!disabled) { checkTheHiveStatus(); loadCases(); }
            loadSidebarBadges();
        });
    </script>
</body>
</html>
