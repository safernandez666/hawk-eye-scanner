notify:
  redacted: true
  suppress_duplicates: true
  channels:
    smtp:
      enabled: false
      host: ''
      port: 587
      use_tls: true
      username: ''
      password: ''
      from_address: ''
      to_addresses: ''
      severity_filter:
      - CRITICAL
      - HIGH
    slack:
      enabled: false
      webhook_url: ''
      severity_filter:
      - CRITICAL
      - HIGH
      - MEDIUM
    teams:
      enabled: false
      webhook_url: ''
      severity_filter:
      - CRITICAL
      - HIGH
      - MEDIUM
    webhook:
      enabled: false
      url: ''
      method: POST
      headers:
        Content-Type: application/json
      severity_filter:
      - CRITICAL
      - HIGH
      - MEDIUM
      - LOW
    thehive:
      enabled: false
      severity_filter:
      - CRITICAL
      - HIGH
      url: http://thehive:9000
      api_key: ''
      create_cases: true
sources:
  mysql:
    poc_mysql:
      host: hawk-mysql
      port: 3306
      user: root
      password: rootpassword
      database: pocdb
  s3:
    poc-bucket:
      access_key: test
      secret_key: test
      bucket_name: poc-bucket
      endpoint_url: http://localstack:4566
      cache: false
