notify:
  redacted: true
  suppress_duplicates: true
  ollama:
    enabled: true
    url: http://host.docker.internal:11434
    model: llama3.1:latest
  channels:
    smtp:
      enabled: true
      severity_filter:
      - CRITICAL
      - HIGH
      - MEDIUM
      - LOW
      host: smtp.hostinger.com
      port: 587
      use_tls: true
      username: your-email@example.com
      password: YOUR_EMAIL_PASSWORD
      from_address: your-email@example.com
      from_name: Poirot Security
      to_addresses: recipient@example.com
    slack:
      enabled: true
      severity_filter:
      - CRITICAL
      - HIGH
      - MEDIUM
      - LOW
      webhook_url: https://hooks.slack.com/services/YOUR/WEBHOOK/URL
    teams:
      enabled: false
      webhook_url: ''
      severity_filter:
      - CRITICAL
      - HIGH
      - MEDIUM
    webhook:
      enabled: false
      url: ''
      method: POST
      headers:
        Content-Type: application/json
      severity_filter:
      - CRITICAL
      - HIGH
      - MEDIUM
      - LOW
    thehive:
      enabled: false
      severity_filter:
      - CRITICAL
      - HIGH
      url: http://thehive:9000
      api_key: YOUR_THEHIVE_API_KEY
      create_cases: true
scheduler:
  enabled: false
  interval_hours: 24
sources:
  mysql:
    poc_mysql:
      host: hawk-mysql
      port: 3306
      user: root
      password: rootpassword
      database: pocdb
  s3:
    poc-bucket:
      access_key: test
      secret_key: test
      bucket_name: poc-bucket
      endpoint_url: http://localstack:4566
