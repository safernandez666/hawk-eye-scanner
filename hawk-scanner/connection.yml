notify:
  redacted: true
  suppress_duplicates: true
  ollama:
    enabled: true
    url: http://host.docker.internal:11434
    model: llama3.1:latest
  channels:
    smtp:
      enabled: true
      severity_filter:
      - CRITICAL
      - HIGH
      - MEDIUM
      - LOW
      host: smtp.hostinger.com
      port: 587
      use_tls: true
      username: sfernandez@ironbox.com.ar
      password: Jupiter34*%??
      from_address: sfernandez@ironbox.com.ar
      from_name: Poirot Security
      to_addresses: sfernandez@ironbox.com.ar
    slack:
      enabled: true
      severity_filter:
      - CRITICAL
      - HIGH
      - MEDIUM
      - LOW
      webhook_url: ${SLACK_WEBHOOK_URL}
    teams:
      enabled: false
      webhook_url: ''
      severity_filter:
      - CRITICAL
      - HIGH
      - MEDIUM
    webhook:
      enabled: false
      url: ''
      method: POST
      headers:
        Content-Type: application/json
      severity_filter:
      - CRITICAL
      - HIGH
      - MEDIUM
      - LOW
    thehive:
      enabled: ${THEHIVE_ENABLED:-true}
      severity_filter:
      - CRITICAL
      - HIGH
      url: ${THEHIVE_URL:-http://thehive:9000}
      api_key: ${THEHIVE_API_KEY:-}
      create_cases: ${THEHIVE_CREATE_CASES:-true}
scheduler:
  enabled: true
  schedule_type: interval
  sources:
  - mysql
  - s3
  interval_hours: 12.0
sources:
  mysql:
    poc_mysql:
      host: hawk-mysql
      port: 3306
      user: root
      password: rootpassword
      database: pocdb
  s3:
    poc-bucket:
      access_key: test
      secret_key: test
      bucket_name: poc-bucket
      endpoint_url: http://localstack:4566
scheduler_jobs: []
